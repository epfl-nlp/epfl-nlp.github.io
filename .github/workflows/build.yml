name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Jekyll build
    runs-on: ubuntu-latest

    # Install exactly what Gemfile.lock pins, and fail if the lockfile is out of
    # sync with the Gemfile. Without this, bundler silently re-resolves
    env:
      BUNDLE_FROZEN: 'true'

    steps:
      - uses: actions/checkout@v4

      # Ruby 3.1 matches the era of the pinned Jekyll 4.2.2. Newer Rubies break
      # the native extensions in eventmachine 1.2.7 / sassc 2.4.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
