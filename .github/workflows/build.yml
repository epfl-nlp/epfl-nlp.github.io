name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Jekyll build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ruby 3.1 is EOL and current gems have dropped it. Dependabot regenerates
      # Gemfile.lock on Linux and pins current versions -- e.g. bumping
      # addressable to 2.9.0 widens its ceiling and pulls public_suffix 7.x,
      # which requires Ruby >= 3.2. Those PRs are unbuildable on anything older.
      #
      # Note that Gemfile.lock is otherwise generated on macOS and lists only
      # darwin platforms, so bundler re-resolves here rather than installing the
      # locked versions. Regenerating the lockfile on Linux would fix that and
      # let CI install exactly what is committed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
